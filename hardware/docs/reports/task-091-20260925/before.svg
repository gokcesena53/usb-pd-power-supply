<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 960" width="1160" height="960" style="background:#0f172a; font-family: ui-sans-serif, system-ui, sans-serif;">
  <defs>
    <pattern id="grid_b" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid_b)" />

  <text x="580" y="40" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">TASK-091 ETHERNET &amp; MCU ANKRAJ REVIZYONU — ÖNCE (BEFORE)</text>
  <text x="580" y="65" fill="#f87171" font-size="13" text-anchor="middle">Mevcut J9 Pad 4-5 RJ45 keepout izdüşümünde; MCU'nun LCD izdüşümü ve USB-C yakınlığı inceleniyor</text>

  <!-- PCB Outline -->
  <rect x="162.39999999999998" y="155.84000000000003" width="795.1999999999999" height="488.32000000000005" rx="24" ry="24" fill="#064e3b" fill-opacity="0.25" stroke="#10b981" stroke-width="2.5" />
  <text x="560.0" y="172.0" fill="#10b981" font-size="11" font-weight="bold" text-anchor="middle">PCB SINIRI (99.40 x 61.04 mm)</text>

  <!-- Mounting Holes -->
  <circle cx="194.39999999999998" cy="187.84000000000003" r="12.8" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="194.39999999999998" cy="187.84000000000003" r="24.0" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="194.39999999999998" y="172.84000000000003" fill="#94a3b8" font-size="10" text-anchor="middle">H1</text>

  <circle cx="194.39999999999998" cy="612.16" r="12.8" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="194.39999999999998" cy="612.16" r="24.0" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="194.39999999999998" y="637.16" fill="#94a3b8" font-size="10" text-anchor="middle">H3</text>

  <!-- LCD Envelope -->
  <rect x="268.16" y="178.24" width="624.8" height="443.52" fill="#1e293b" fill-opacity="0.3" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="580.56" y="224.0" fill="#3b82f6" font-size="12" text-anchor="middle">TFT LCD İZDÜŞÜMÜ (Z &lt;= 1.80 mm)</text>

  <!-- J7 USB-C -->
  <g transform="translate(191.8, 260.0)">
    <rect x="-29.4" y="-36.0" width="68.0" height="72.0" fill="#0284c7" fill-opacity="0.5" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="2" fill="#f0f9ff" font-size="11" font-weight="bold" text-anchor="middle">J7 USB-C (Top)</text>
  </g>

  <!-- J8 Mezzanine with RJ45 Keepout -->
  <g transform="translate(580.0, 416.0)">
    <rect x="-444.0" y="-17.6" width="464.0" height="177.6" rx="8" ry="8" fill="#475569" fill-opacity="0.2" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
    <!-- RJ45 Jack body on West -->
    <rect x="-444.0" y="6.72" width="176.0" height="128.8" fill="#dc2626" fill-opacity="0.4" stroke="#ef4444" stroke-width="2"/>
    <text x="-356.0" y="71.12" fill="#fca5a5" font-size="11" font-weight="bold" text-anchor="middle">RJ45 Port</text>
    <text x="-356.0" y="86.12" fill="#fca5a5" font-size="9" text-anchor="middle">B.Cu Keepout Alanı</text>
  </g>

  <!-- Old J9 (Vertical, colliding with RJ45 keepout) -->
  <g transform="translate(224.0, 320.0)">
    <rect x="-11.2" y="-24.0" width="22.4" height="164.0" fill="#8b5cf6" fill-opacity="0.3" stroke="#a78bfa" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="5" fill="#f8fafc"/>
    <circle cx="0" cy="33.6" r="5" fill="#f8fafc"/>
    <circle cx="0" cy="67.2" r="5" fill="#f8fafc"/>
    <!-- Overlapping pads -->
    <circle cx="0" cy="100.8" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="0" cy="134.4" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
    <text x="-15" y="117.6" fill="#ef4444" font-size="10" font-weight="bold" text-anchor="end">J9 Pad 4-5 Çakışma!</text>
  </g>

  <!-- U2 Candidate 1 in LCD area -->
  <g transform="translate(384.0, 204.79999999999995)">
    <rect x="-52.8" y="-88.0" width="105.6" height="40.96" fill="#ef4444" fill-opacity="0.25" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,4"/>
    <rect x="-52.8" y="-47.04" width="105.6" height="92.0" fill="#eab308" fill-opacity="0.4" stroke="#facc15" stroke-width="2"/>
    <text x="0" y="0" fill="#fef08a" font-size="11" font-weight="bold" text-anchor="middle">U2 (Z = 2.40mm)</text>
    <text x="0" y="16" fill="#fef08a" font-size="9" text-anchor="middle">LCD İzdüşümünde (Y &gt; 72.28)</text>
  </g>

  <!-- Legend -->
  <rect x="50" y="850" width="600" height="80" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="70" y="875" fill="#f8fafc" font-size="12" font-weight="bold">TASK-091 Giriş Sorunları:</text>
  <text x="70" y="895" fill="#fca5a5" font-size="11">1. Düşey J9 enkoder pedleri (Pad 4 ve 5) alttaki RJ45 metal priz keepout'u ile çakışıyor</text>
  <text x="70" y="915" fill="#fef08a" font-size="11">2. U2 MCU modülü LCD toleranslı alanına giriyor; LCD yüksekliği ve USB yakınlığı değerlendirilmeli</text>
</svg>