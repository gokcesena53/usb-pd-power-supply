<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 960" width="1160" height="960" style="background:#0f172a; font-family: ui-sans-serif, system-ui, sans-serif;">
  <defs>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4ade80" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid2)" />

  <text x="580" y="40" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">TASK-063 MEKANIK ANKRAJLAR — SONRA (FINAL APPROVED ANCHORS)</text>
  <text x="580" y="65" fill="#4ade80" font-size="13" text-anchor="middle">J7 USB-C Top, J8 ETH Bottom, U2 Kuzeybatı Anten Dışarı, J9 Kablo Koridoru, 0 DRC Hatası</text>

  <!-- PCB Outline -->
  <rect x="162.39999999999998" y="155.84000000000003" width="795.1999999999999" height="488.32000000000005" rx="24" ry="24" fill="#064e3b" fill-opacity="0.3" stroke="#10b981" stroke-width="2.5" />
  <text x="560.0" y="172.0" fill="#10b981" font-size="11" font-weight="bold" text-anchor="middle">KUZEY KENAR (Y = 69.48 mm)</text>
  <text x="152.0" y="400.0" fill="#10b981" font-size="11" font-weight="bold" text-anchor="middle" transform="rotate(-90 152.0 400.0)">SOL KENAR (X = 50.30 mm)</text>

  <!-- Mounting Holes -->
  <circle cx="194.39999999999998" cy="187.84000000000003" r="12.8" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="194.39999999999998" cy="187.84000000000003" r="24.0" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="194.39999999999998" y="172.84000000000003" fill="#94a3b8" font-size="10" text-anchor="middle">H1</text>

  <circle cx="925.5999999999999" cy="187.84000000000003" r="12.8" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="925.5999999999999" cy="187.84000000000003" r="24.0" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="925.5999999999999" y="172.84000000000003" fill="#94a3b8" font-size="10" text-anchor="middle">H2</text>

  <circle cx="194.39999999999998" cy="612.16" r="12.8" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="194.39999999999998" cy="612.16" r="24.0" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="194.39999999999998" y="637.16" fill="#94a3b8" font-size="10" text-anchor="middle">H3</text>

  <circle cx="925.5999999999999" cy="612.16" r="12.8" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="925.5999999999999" cy="612.16" r="24.0" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="925.5999999999999" y="637.16" fill="#94a3b8" font-size="10" text-anchor="middle">H4</text>

  <!-- LCD Envelope -->
  <rect x="268.16" y="178.24" width="624.8" height="443.52" fill="#1e293b" fill-opacity="0.3" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="580.56" y="224.0" fill="#3b82f6" font-size="12" text-anchor="middle">TFT LCD İZDÜŞÜMÜ (Z &lt;= 1.80 mm)</text>

  <!-- J3 FPC -->
  <rect x="532.0" y="410.4" width="24.0" height="128.0" fill="#f59e0b" fill-opacity="0.3" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="544.0" y="479.4" fill="#f59e0b" font-size="10" font-weight="bold" text-anchor="middle">J3 (LCD)</text>

  <!-- C34 Relocated -->
  <rect x="594.4" y="440.4" width="8.0" height="8.0" fill="#10b981" stroke="#10b981" stroke-width="1.5"/>
  <text x="598.4" y="436.4" fill="#10b981" font-size="9" text-anchor="middle">C34 (104.8, 105.55)</text>

  <!-- U2 ESP32-C6 (78.0, 75.6 on F.Cu, rot 0) -->
  <g transform="translate(384.0, 204.79999999999995)">
    <!-- Antenna Keepout outside board -->
    <rect x="-52.8" y="-88.0" width="105.6" height="40.96" fill="#ef4444" fill-opacity="0.25" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="0" y="-64.0" fill="#fca5a5" font-size="9" font-weight="bold" text-anchor="middle">RF ANTEN (Dışarıda: 4.88mm)</text>
    <!-- Module Body -->
    <rect x="-52.8" y="-47.04" width="105.6" height="92.0" fill="#0284c7" fill-opacity="0.5" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="0" fill="#f0f9ff" font-size="11" font-weight="bold" text-anchor="middle">U2 ESP32-C6</text>
    <text x="0" y="16" fill="#e0f2fe" font-size="9" text-anchor="middle">F.Cu (78.0, 75.6)</text>
  </g>

  <!-- J7 USB-C (53.975, 82.5 on F.Cu, rot 270) -->
  <g transform="translate(191.8, 260.0)">
    <!-- Front nose overhang past X=50.30 -->
    <rect x="-33.6" y="-36.0" width="4.24" height="72.0" fill="#f59e0b" fill-opacity="0.6" stroke="#f59e0b" stroke-width="1"/>
    <!-- Body -->
    <rect x="-29.4" y="-36.0" width="68.0" height="72.0" fill="#0284c7" fill-opacity="0.5" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="2" fill="#f0f9ff" font-size="11" font-weight="bold" text-anchor="middle">J7 USB-C</text>
    <text x="0" y="15" fill="#e0f2fe" font-size="9" text-anchor="middle">F.Cu (53.98, 82.5)</text>
  </g>

  <!-- J9 Encoder (58.0, 90.0 on F.Cu, rot -90) -->
  <g transform="translate(224.0, 320.0)">
    <rect x="-11.2" y="-24.0" width="22.4" height="164.0" fill="#8b5cf6" fill-opacity="0.5" stroke="#a78bfa" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="5" fill="#f8fafc"/>
    <circle cx="0" cy="33.6" r="5" fill="#f8fafc"/>
    <circle cx="0" cy="67.2" r="5" fill="#f8fafc"/>
    <circle cx="0" cy="100.8" r="5" fill="#f8fafc"/>
    <circle cx="0" cy="134.4" r="5" fill="#f8fafc"/>
    <text x="25" y="67.2" fill="#c4b5fd" font-size="10" font-weight="bold" text-anchor="start">J9 (5P Enkoder)</text>
  </g>

  <!-- J8 Mezzanine (102.5, 102.0 on B.Cu, rot 0) -->
  <g transform="translate(580.0, 416.0)">
    <!-- Mezzanine PCB body outline -->
    <rect x="-444.0" y="-17.6" width="464.0" height="177.6" rx="8" ry="8" fill="#475569" fill-opacity="0.3" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
    <!-- RJ45 Jack body on West -->
    <rect x="-444.0" y="6.72" width="176.0" height="128.8" fill="#0d9488" fill-opacity="0.6" stroke="#2dd4bf" stroke-width="2"/>
    <text x="-356.0" y="71.12" fill="#ccfbf1" font-size="11" font-weight="bold" text-anchor="middle">RJ45 Port</text>
    <text x="-356.0" y="86.12" fill="#ccfbf1" font-size="9" text-anchor="middle">3.3mm Taşma</text>
    <!-- Header pins on East -->
    <rect x="-26.32" y="-6" width="32.32" height="154.24" fill="#334155" stroke="#cbd5e1" stroke-width="1"/>
    <text x="-10" y="72.0" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="end">J8 Mezzanine</text>
  </g>

  <!-- Plug Clearance Annotation -->
  <line x1="128.0" y1="260.0" x2="128.0" y2="487.12" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="32.0" y="344.0" width="115" height="35" rx="4" fill="#0369a1" stroke="#38bdf8" stroke-width="1"/>
  <text x="89.0" y="359.0" fill="#f0f9ff" font-size="10" font-weight="bold" text-anchor="middle">Fiş Açıklığı</text>
  <text x="89.0" y="372.0" fill="#f0f9ff" font-size="9" text-anchor="middle">14.39 mm &gt;&gt; 2mm</text>

  <!-- USB D+/D- route annotation -->
  <path d="M 221.2 260.0 Q 304.0 240.0 384.0 224.0" fill="none" stroke="#4ade80" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arrow-green)"/>
  <text x="304.0" y="272.0" fill="#4ade80" font-size="9" font-weight="bold">USB 2.0 (~25mm)</text>

  <!-- J9 to Front Panel Cable Exit Corridor -->
  <path d="M 224.0 384.0 L 144.0 384.0" stroke="#a78bfa" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="144.0" y="368.0" fill="#c4b5fd" font-size="9" text-anchor="end">Enkoder Kablo Çıkışı</text>

  <!-- Legend -->
  <rect x="50" y="850" width="700" height="85" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="70" y="873" fill="#f8fafc" font-size="12" font-weight="bold">TASK-063 Doğrulama Kanıtları:</text>
  <text x="70" y="892" fill="#94a3b8" font-size="11">• J7 F.Cu (53.98, 82.50) sol kenar 0.00mm hata ile hizalı; J8 B.Cu (102.50, 102.00) RJ45 ağzı West</text>
  <text x="70" y="908" fill="#94a3b8" font-size="11">• Fiş açıklığı 14.39 mm &gt;= 2.0 mm; U2 F.Cu (78.0, 75.6) anteni 4.88mm kuzeye açık alana uzanır</text>
  <text x="70" y="924" fill="#94a3b8" font-size="11">• J9 F.Cu (58.0, 90.0) LCD mesafesi 5.52mm; C34 (104.8, 105.55) taşındı; DRC Error 0, Parity 0</text>
</svg>