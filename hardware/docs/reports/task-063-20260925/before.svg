<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 960" width="1160" height="960" style="background:#0f172a; font-family: ui-sans-serif, system-ui, sans-serif;">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />

  <text x="580" y="40" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">TASK-063 MEKANIK ANKRAJLAR — ÖNCE (BEFORE PLACEMENT)</text>
  <text x="580" y="65" fill="#94a3b8" font-size="13" text-anchor="middle">Portlar ve modüller dağınık veya geçici park alanlarında; mekanik sol panel hizalaması yok</text>

  <!-- PCB Outline -->
  <rect x="162.39999999999998" y="155.84000000000003" width="795.1999999999999" height="488.32000000000005" rx="24" ry="24" fill="#064e3b" fill-opacity="0.3" stroke="#10b981" stroke-width="2.5" />
  <text x="560.0" y="184.0" fill="#10b981" font-size="12" font-weight="bold" text-anchor="middle">ANA PCB SINIRI (99.40 x 61.04 mm)</text>

  <!-- Mounting Holes -->
  <circle cx="194.39999999999998" cy="187.84000000000003" r="12.8" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="194.39999999999998" cy="187.84000000000003" r="24.0" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="194.39999999999998" y="172.84000000000003" fill="#94a3b8" font-size="10" text-anchor="middle">H1</text>

  <circle cx="925.5999999999999" cy="187.84000000000003" r="12.8" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="925.5999999999999" cy="187.84000000000003" r="24.0" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="925.5999999999999" y="172.84000000000003" fill="#94a3b8" font-size="10" text-anchor="middle">H2</text>

  <circle cx="194.39999999999998" cy="612.16" r="12.8" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="194.39999999999998" cy="612.16" r="24.0" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="194.39999999999998" y="637.16" fill="#94a3b8" font-size="10" text-anchor="middle">H3</text>

  <circle cx="925.5999999999999" cy="612.16" r="12.8" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="925.5999999999999" cy="612.16" r="24.0" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="925.5999999999999" y="637.16" fill="#94a3b8" font-size="10" text-anchor="middle">H4</text>

  <!-- LCD Envelope -->
  <rect x="268.16" y="178.24" width="624.8" height="443.52" fill="#1e293b" fill-opacity="0.5" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="580.56" y="240.0" fill="#3b82f6" font-size="12" text-anchor="middle">TFT LCD İZDÜŞÜMÜ (Z &lt;= 1.80 mm)</text>

  <!-- J3 FPC -->
  <rect x="532.0" y="410.4" width="24.0" height="128.0" fill="#f59e0b" fill-opacity="0.4" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="544.0" y="479.4" fill="#f59e0b" font-size="10" font-weight="bold" text-anchor="middle">J3 (LCD)</text>

